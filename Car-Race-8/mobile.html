<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>賽車著色</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile.css?v=1">
</head>
<body>
  <div class="app-shell">

    <div class="top-bar">
      <div class="top-left">
        <span class="logo">&#127937;</span>
        <div>
          <h1>賽車著色</h1>
        </div>
      </div>
      <div id="connBadge" class="conn-badge offline">連線中</div>
    </div>

    <div class="canvas-wrap">
      <div class="canvas-box" id="canvasBox">
        <canvas id="guideCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="car-select" id="carSelect"></div>

    <div class="palette" id="palette"></div>

    <div class="tool-row">
      <button id="undoBtn" class="tool-btn">&#8630; 復原</button>
      <button id="clearBtn" class="tool-btn">&#128465; 清空</button>
      <button id="eraserBtn" class="tool-btn">&#128065; 橡皮擦</button>
    </div>

    <div class="size-row">
      <span>筆刷</span>
      <input type="range" id="sizeSlider" min="3" max="40" value="12" step="1">
      <output id="sizeDisplay">12</output>
    </div>

    <button id="submitBtn" class="submit-btn" disabled>
      &#128663; 送出賽車去比賽
    </button>

    <div class="status-msg" id="statusMsg">請掃描大螢幕 QR Code</div>
  </div>

  <div id="successModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-emoji">&#127937;</div>
      <h2>賽車出發啦！</h2>
      <p>你的賽車已送上大螢幕的 8 字型賽道，快抬頭看它奔馳！</p>
      <button id="againBtn" class="modal-btn">再畫一台</button>
    </div>
  </div>

  <script src="vendor/ably.min.js?v=1"></script>
  <script src="js/mobile.js?v=1"></script>
</body>
</html>
